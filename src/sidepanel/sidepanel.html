<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Image Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <div class="logo-icon">📰</div>
        <div>
          <h1>News Image Downloader</h1>
          <p class="subtitle">Bulk image harvester for news titles</p>
        </div>
      </div>
      <div class="header-badge" id="statusBadge">Idle</div>
    </header>

    <!-- Main Content -->
    <main class="app-main">

      <!-- Input Section -->
      <section class="card" id="inputSection">
        <div class="card-header">
          <span class="card-icon">📝</span>
          <h2>News Titles</h2>
        </div>
        <textarea
          id="titles"
          rows="6"
          placeholder="Enter news titles here, one per line:&#10;&#10;Bangladesh wins cricket match&#10;New bridge opens in Dhaka&#10;Heavy rain hits Khulna"></textarea>
        <div class="char-hint" id="titleCount">0 titles</div>
      </section>

      <!-- Settings Section -->
      <section class="card" id="settingsSection">
        <div class="card-header collapsible" id="settingsToggle">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="card-icon">⚙️</span>
            <h2>Settings</h2>
          </div>
          <span class="collapse-arrow" id="settingsArrow">▼</span>
        </div>
        <div class="settings-body" id="settingsBody">
          <div class="settings-grid">
            <div class="setting-row">
              <label for="imagesPerTitle">Images per title</label>
              <div class="input-with-unit">
                <input type="number" id="imagesPerTitle" min="1" max="50" value="5">
                <span class="unit">images</span>
              </div>
            </div>
            <div class="setting-row">
              <label for="minWidth">Minimum width</label>
              <div class="input-with-unit">
                <input type="number" id="minWidth" min="100" max="8000" value="1200">
                <span class="unit">px</span>
              </div>
            </div>
            <div class="setting-row">
              <label for="minAspectRatio">Min aspect ratio</label>
              <div class="input-with-unit">
                <input type="number" id="minAspectRatio" step="0.1" min="0.5" max="5" value="1.4">
                <span class="unit">w/h</span>
              </div>
            </div>
            <div class="setting-row">
              <label for="rootFolder">Save folder</label>
              <input type="text" id="rootFolder" value="News Images" style="width:100%;box-sizing:border-box;">
            </div>
            <div class="setting-row">
              <label for="searchDelay">Delay between searches</label>
              <div class="input-with-unit">
                <input type="number" id="searchDelay" min="1000" max="10000" step="500" value="3000">
                <span class="unit">ms</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Controls Section -->
      <section class="controls-section">
        <button id="btnStart" class="btn btn-primary">
          <span class="btn-icon">▶</span> Start
        </button>
        <button id="btnPause" class="btn btn-warning" disabled>
          <span class="btn-icon">⏸</span> Pause
        </button>
        <button id="btnResume" class="btn btn-success" disabled>
          <span class="btn-icon">▶▶</span> Resume
        </button>
        <button id="btnStop" class="btn btn-danger" disabled>
          <span class="btn-icon">■</span> Stop
        </button>
      </section>

      <!-- Progress Section -->
      <section class="card progress-card" id="progressSection" style="display:none;">
        <div class="card-header">
          <span class="card-icon">📊</span>
          <h2>Progress</h2>
        </div>

        <div class="current-info">
          <div class="current-label">Currently processing</div>
          <div class="current-title" id="currentTask">—</div>
          <div class="current-sub" id="currentSub"></div>
        </div>

        <!-- Overall Progress Bar -->
        <div class="progress-wrap">
          <div class="progress-label">
            <span id="progressLabel">0 / 0 titles</span>
            <span id="progressPct">0%</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
          </div>
        </div>

        <!-- Stats Row -->
        <div class="stats-row">
          <div class="stat-chip stat-green">
            <span class="stat-val" id="statCompleted">0</span>
            <span class="stat-lbl">✓ Done</span>
          </div>
          <div class="stat-chip stat-yellow">
            <span class="stat-val" id="statProcessing">0</span>
            <span class="stat-lbl">● Active</span>
          </div>
          <div class="stat-chip stat-red">
            <span class="stat-val" id="statFailed">0</span>
            <span class="stat-lbl">✕ Failed</span>
          </div>
          <div class="stat-chip stat-blue">
            <span class="stat-val" id="statImages">0</span>
            <span class="stat-lbl">📷 Images</span>
          </div>
        </div>
      </section>

      <!-- Queue List -->
      <section class="card queue-card" id="queueSection" style="display:none;">
        <div class="card-header">
          <span class="card-icon">🗂</span>
          <h2>Queue</h2>
        </div>
        <div class="queue-list" id="queueList">
          <!-- Injected dynamically -->
        </div>
      </section>

    </main>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>

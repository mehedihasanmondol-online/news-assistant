<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Image Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h2>News Image Downloader</h2>
    </header>

    <main>
      <section class="input-section">
        <label for="titles">News Titles (One per line)</label>
        <textarea id="titles" rows="5" placeholder="Bangladesh wins cricket match&#10;New bridge opens in Dhaka"></textarea>
      </section>

      <section class="settings-section">
        <h3>Settings</h3>
        <div class="setting-group">
          <label for="imagesPerTitle">Images per title:</label>
          <input type="number" id="imagesPerTitle" min="1" max="50" value="5">
        </div>
        <div class="setting-group">
          <label for="minWidth">Minimum width:</label>
          <input type="number" id="minWidth" min="100" max="4000" value="1200">
        </div>
        <div class="setting-group">
          <label for="minAspectRatio">Min aspect ratio:</label>
          <input type="number" id="minAspectRatio" step="0.1" min="0.5" max="3" value="1.4">
        </div>
        <div class="setting-group">
          <label for="rootFolder">Root folder:</label>
          <input type="text" id="rootFolder" value="News Images">
        </div>
      </section>

      <section class="controls-section">
        <button id="btnStart" class="btn primary">Start</button>
        <button id="btnPause" class="btn warning" disabled>Pause</button>
        <button id="btnResume" class="btn success" disabled>Resume</button>
        <button id="btnStop" class="btn danger" disabled>Stop</button>
      </section>

      <section class="progress-section">
        <h3>Progress</h3>
        <div class="status-text" id="overallStatus">Status: Idle</div>
        <div class="current-task" id="currentTask"></div>
        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-value" id="statCompleted">0</span>
            <span class="stat-label">Completed</span>
          </div>
          <div class="stat-box">
            <span class="stat-value" id="statFailed">0</span>
            <span class="stat-label">Failed</span>
          </div>
          <div class="stat-box">
            <span class="stat-value" id="statImages">0</span>
            <span class="stat-label">Images</span>
          </div>
        </div>
        
        <div class="queue-list" id="queueList">
          <!-- Queue items injected here -->
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
